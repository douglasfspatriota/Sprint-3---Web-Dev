<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Os cinco gestos do Dynamic Action Button: tap, hold, drag direita, drag cima e drag circular">
  <rect x="0" y="0" width="900" height="260" rx="20" fill="#f5f6fa" />

  <!-- Tap -->
  <g transform="translate(60,60)">
    <circle cx="50" cy="50" r="34" fill="#1a3c8f" opacity="0.08" />
    <circle cx="50" cy="50" r="18" fill="#ff7a45" />
    <circle cx="50" cy="50" r="34" fill="none" stroke="#ff7a45" stroke-width="3" stroke-dasharray="4 6" />
    <text x="50" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#1a3c8f" font-weight="700">Tap</text>
  </g>

  <!-- Hold -->
  <g transform="translate(230,60)">
    <circle cx="50" cy="50" r="34" fill="#1a3c8f" opacity="0.08" />
    <circle cx="50" cy="50" r="24" fill="none" stroke="#ff7a45" stroke-width="6" />
    <circle cx="50" cy="50" r="10" fill="#ff7a45" />
    <text x="50" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#1a3c8f" font-weight="700">Hold</text>
  </g>

  <!-- Drag direita -->
  <g transform="translate(400,60)">
    <circle cx="50" cy="50" r="34" fill="#1a3c8f" opacity="0.08" />
    <circle cx="26" cy="50" r="12" fill="#ff7a45" />
    <path d="M40 50 H 78" stroke="#ff7a45" stroke-width="4" stroke-linecap="round" />
    <polygon points="78,50 66,42 66,58" fill="#ff7a45" />
    <text x="50" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1a3c8f" font-weight="700">Drag →</text>
  </g>

  <!-- Drag cima -->
  <g transform="translate(570,60)">
    <circle cx="50" cy="50" r="34" fill="#1a3c8f" opacity="0.08" />
    <circle cx="50" cy="74" r="12" fill="#ff7a45" />
    <path d="M50 60 V 22" stroke="#ff7a45" stroke-width="4" stroke-linecap="round" />
    <polygon points="50,22 42,34 58,34" fill="#ff7a45" />
    <text x="50" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1a3c8f" font-weight="700">Drag ↑</text>
  </g>

  <!-- Drag circular -->
  <g transform="translate(740,60)">
    <circle cx="50" cy="50" r="34" fill="#1a3c8f" opacity="0.08" />
    <path d="M30 40 A 22 22 0 1 1 28 62" stroke="#ff7a45" stroke-width="4" fill="none" stroke-linecap="round" />
    <polygon points="28,62 24,48 38,54" fill="#ff7a45" />
    <text x="50" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#1a3c8f" font-weight="700">Drag ↺</text>
  </g>
</svg>
