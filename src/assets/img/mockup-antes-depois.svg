<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Comparativo: camera atual leva 4 passos e 4,2 segundos, NextCam leva 1 passo e 0,8 segundos">
  <rect x="0" y="0" width="800" height="320" rx="20" fill="#f5f6fa" />

  <!-- Antes -->
  <g transform="translate(40,40)">
    <text x="0" y="0" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#5a6376">Câmera atual</text>
    <g transform="translate(0,24)">
      <rect x="0" y="0" width="70" height="70" rx="12" fill="#ffffff" stroke="#d8dae2" stroke-width="2" />
      <text x="35" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#5a6376">1</text>

      <rect x="95" y="0" width="70" height="70" rx="12" fill="#ffffff" stroke="#d8dae2" stroke-width="2" />
      <text x="130" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#5a6376">2</text>

      <rect x="190" y="0" width="70" height="70" rx="12" fill="#ffffff" stroke="#d8dae2" stroke-width="2" />
      <text x="225" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#5a6376">3</text>

      <rect x="285" y="0" width="70" height="70" rx="12" fill="#ffffff" stroke="#d8dae2" stroke-width="2" />
      <text x="320" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#5a6376">4</text>

      <path d="M70 35 H 92" stroke="#c7cad4" stroke-width="3" />
      <path d="M165 35 H 187" stroke="#c7cad4" stroke-width="3" />
      <path d="M260 35 H 282" stroke="#c7cad4" stroke-width="3" />
    </g>
    <text x="0" y="140" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#5a6376">~4,2s</text>
  </g>

  <line x1="400" y1="20" x2="400" y2="300" stroke="#d8dae2" stroke-width="2" stroke-dasharray="6 8" />

  <!-- Depois -->
  <g transform="translate(460,40)">
    <text x="0" y="0" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1a3c8f">NextCam</text>
    <g transform="translate(0,24)">
      <rect x="0" y="0" width="70" height="70" rx="12" fill="#ff7a45" />
      <circle cx="35" cy="35" r="14" fill="#ffffff" />
    </g>
    <text x="0" y="140" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#ff7a45">~0,8s</text>
  </g>
</svg>
